<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src deepread-galaxy:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>观点交锋</title>
<style>
  :root {
    --serif: "Songti SC", "Noto Serif SC", "STSong", serif;
    --sans: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    --ink: #f3ece2; --muted: rgba(243,236,226,0.62); --line: rgba(255,255,255,0.12);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #04030a; color: var(--ink); font-family: var(--sans); overflow: hidden; overscroll-behavior: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* A warm light leak from the off-screen sun. */
  #leak { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 60% at -10% 30%, rgba(255,190,120,0.10), transparent 60%),
                radial-gradient(90% 50% at 50% 115%, rgba(8,6,20,0.85), transparent 70%),
                radial-gradient(100% 40% at 50% -10%, rgba(4,3,10,0.9), transparent 70%); }

  /* ---- hero */
  #hero { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safe-top) + 58px) 64px 0 24px; pointer-events: none;
    transition: opacity .7s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
  #kicker { font-size: 12px; letter-spacing: .24em; color: #e8c79a; text-transform: uppercase; margin: 0 0 10px; }
  #title { font-family: var(--serif); font-weight: 700; font-size: 26px; line-height: 1.28; margin: 0 0 10px; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  #lede { font-size: 13.5px; line-height: 1.65; color: var(--muted); margin: 0; max-width: 34em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #dispute-btn { pointer-events: auto; margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 14px 8px 10px;
    border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #dispute-btn .orb { width: 16px; height: 16px; }

  /* ---- floating moon labels */
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px;
    background: rgba(12,10,22,0.55); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .35s ease; pointer-events: none; will-change: transform; }
  .tag.show { opacity: 1; pointer-events: auto; }
  .tag i { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .tag em { font-style: normal; color: var(--muted); font-size: 11px; }

  /* ---- dock with camp chips */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 0 calc(var(--safe-bottom) + 16px);
    transition: opacity .6s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
  #legend { display: flex; gap: 14px; padding: 0 22px 10px; font-size: 11px; color: var(--muted); }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 7px; height: 7px; border-radius: 50%; }
  #chips { display: flex; gap: 10px; overflow-x: auto; padding: 2px 20px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; scroll-snap-align: start; display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; border-radius: 18px;
    background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04)); border: 1px solid rgba(255,255,255,0.13);
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); text-align: left;
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.35); transition: transform .2s ease; }
  .chip:active { transform: scale(.96); }
  .chip-text { display: flex; flex-direction: column; gap: 2px; }
  .chip b { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .chip b::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .chip small { font-size: 11px; color: var(--muted); }

  /* tiny CSS planets used as icons */
  .orb { width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; display: inline-block; box-shadow: inset -5px -4px 8px rgba(0,0,0,.55), 0 0 10px rgba(255,255,255,.06); }
  .orb-io { background: radial-gradient(circle at 35% 35%, #f6e7a2, #d9b04c 55%, #8a5a1c); }
  .orb-europa { background: radial-gradient(circle at 35% 35%, #fbf8f2, #d9cfc2 55%, #8d7a68); }
  .orb-ganymede { background: radial-gradient(circle at 35% 35%, #c9c1b5, #7d7266 55%, #3d352e); }
  .orb-callisto { background: radial-gradient(circle at 35% 35%, #8c8173, #4b4239 55%, #221d18); }
  .orb-amalthea { background: radial-gradient(circle at 35% 35%, #d4876a, #8e4b32 55%, #3e1c11); border-radius: 46% 54% 50% 50%; }
  .orb-jupiter { background: repeating-linear-gradient(180deg, #e9dcc4 0 3px, #b07d4f 3px 5px, #dcc7a6 5px 8px); }

  /* ---- content sheet */
  #sheet { position: fixed; left: 10px; right: 10px; bottom: calc(var(--safe-bottom) + 10px); max-height: 54vh; border-radius: 28px;
    background: linear-gradient(165deg, rgba(30,26,44,0.62), rgba(12,10,20,0.72));
    border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    transform: translateY(calc(100% + 40px)); transition: transform .75s cubic-bezier(.2,.85,.2,1); overflow: hidden; display: flex; flex-direction: column; }
  #sheet::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent, #e8c79a), transparent); opacity: .8; }
  #close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.10); font-size: 15px; z-index: 2; }
  #sheet-body { overflow-y: auto; padding: 20px 22px 18px; -webkit-overflow-scrolling: touch; }
  #sheet-body.in > * { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  #sheet-body.in > *:nth-child(2) { animation-delay: .05s; } #sheet-body.in > *:nth-child(3) { animation-delay: .1s; }
  #sheet-body.in > *:nth-child(4) { animation-delay: .15s; } #sheet-body.in > *:nth-child(5) { animation-delay: .2s; }
  #sheet-body.in > *:nth-child(n+6) { animation-delay: .25s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .sheet-top { display: flex; align-items: center; justify-content: space-between; margin: 0 44px 14px 0; }
  .moon-cap { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .moon-cap .orb { width: 18px; height: 18px; }
  .moon-cap em { font-style: italic; font-family: var(--serif); opacity: .7; }
  .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  #sheet h2 { font-family: var(--serif); font-size: 25px; margin: 12px 0 6px; letter-spacing: .02em; }
  .holders { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
  .arg { font-size: 15.5px; line-height: 1.8; margin: 0 0 16px; color: #ece4d8; }
  blockquote { margin: 0 0 16px; padding: 12px 16px; border-left: 2px solid var(--accent); border-radius: 0 14px 14px 0; background: rgba(255,255,255,0.05);
    font-family: var(--serif); font-size: 15.5px; line-height: 1.7; }
  blockquote cite { display: block; margin-top: 6px; font-family: var(--sans); font-style: normal; font-size: 12px; color: var(--muted); }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .cite { font-size: 11.5px; color: var(--muted); padding: 3px 9px 3px 4px; border-radius: 999px; background: rgba(255,255,255,0.06); display: inline-flex; gap: 6px; align-items: center; }
  .cite b { font-weight: 600; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.14); color: var(--ink); }
  .nav { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
  .nav button { font-size: 13px; color: var(--muted); padding: 6px 2px; }
  .dispute { font-family: var(--serif); font-size: 19px; line-height: 1.7; margin: 14px 0 16px; }
  .takeaway { padding: 14px 16px; border-radius: 18px; background: linear-gradient(150deg, rgba(232,199,154,0.16), rgba(232,199,154,0.05)); border: 1px solid rgba(232,199,154,0.25); margin-bottom: 16px; }
  .takeaway b { font-size: 12px; letter-spacing: .12em; color: #e8c79a; }
  .takeaway p { margin: 8px 0 0; font-size: 15px; line-height: 1.75; }
  .camp-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .camp-list button { text-align: left; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.06); font-size: 14px; display: flex; flex-direction: column; gap: 2px; position: relative; padding-left: 26px; }
  .camp-list i { position: absolute; left: 12px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .camp-list small { font-size: 11px; color: var(--muted); }

  #hint { position: fixed; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 132px); text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .6s; }
  #fps { position: fixed; top: calc(var(--safe-top) + 8px); right: 12px; font: 11px ui-monospace, monospace; color: #8f8; display: none; }
  body.show-fps #fps { display: block; }

  /* ---- mode choreography */
  body[data-mode="intro"] #hero { opacity: 0; transform: translateY(-10px); }
  body[data-mode="intro"] #dock, body[data-mode="intro"] #hint { opacity: 0; transform: translateY(30px); pointer-events: none; }
  body[data-mode="focus"] #hero { opacity: 0; transform: translateY(-24px); }
  body[data-mode="focus"] #hero * { pointer-events: none !important; }
  body[data-mode="focus"] #dock, body[data-mode="focus"] #hint { opacity: 0; transform: translateY(40px); pointer-events: none; }
  body[data-mode="focus"] #sheet { transform: none; }
  body[data-mode="overview"] #hero { transition-delay: .1s; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01s !important; } }
</style>
</head>
<body data-mode="intro">
  <canvas id="scene"></canvas>
  <div id="leak"></div>
  <header id="hero">
    <p id="kicker"></p>
    <h1 id="title"></h1>
    <p id="lede"></p>
    <button id="dispute-btn"><span class="orb orb-jupiter"></span>核心争议 · 点木星</button>
  </header>
  <div id="labels"></div>
  <div id="hint">拖动旋转星系 · 点击卫星查看各方观点</div>
  <nav id="dock">
    <div id="legend">
      <span><i style="background:#6fbf8a"></i>支持</span>
      <span><i style="background:#e3b04b"></i>中立或折中</span>
      <span><i style="background:#e0654f"></i>反对</span>
    </div>
    <div id="chips"></div>
  </nav>
  <section id="sheet" aria-live="polite">
    <button id="close" aria-label="返回星系">✕</button>
    <div id="sheet-body"></div>
  </section>
  <div id="fps"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
