name: AmberDeepRead
options:
  bundleIdPrefix: app.amber.deepread
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-markdown:
    url: https://github.com/apple/swift-markdown.git
    from: 0.5.0
targets:
  DeepRead:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Galaxy/**"
      # The Jupiter debate page keeps its folder layout (ES module imports resolve relative paths).
      - path: Resources/Galaxy
        type: folder
      - path: Core
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers:
          - app.amber.deepread.generation.*
        # Let SwiftUI animations run at ProMotion 120 Hz; iPhone apps are capped at 60 Hz without it.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.deepread
        PRODUCT_NAME: AmberDeepRead
        PRODUCT_MODULE_NAME: AmberDeepRead
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 深度阅读
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOEmbedded
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-markdown
        product: Markdown
  DeepReadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DeepRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.amber.deepread.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AmberDeepRead.app/AmberDeepRead"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DeepRead:
    build:
      targets:
        DeepRead: all
    test:
      targets:
        - DeepReadTests
